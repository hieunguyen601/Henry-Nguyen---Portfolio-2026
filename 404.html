<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    >
    <title>404 — Page Not Found</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #171717;
        font-family: "Space Grotesk", sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        animation: fadeIn 0.45s ease forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeOut {
        to { opacity: 0; transform: translateY(-14px); }
      }

      body.leaving {
        animation: fadeOut 0.35s ease forwards;
        pointer-events: none;
      }

      .wrap { padding: 40px 24px; }

      .code {
        font-size: clamp(6rem, 20vw, 10rem);
        font-weight: 700;
        color: #4ee1a0;
        line-height: 1;
        letter-spacing: -4px;
      }

      .title {
        font-size: 1.6rem;
        font-weight: 600;
        margin: 20px 0 10px;
      }

      .sub {
        color: rgba(255, 255, 255, 0.45);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 40px;
        max-width: 340px;
        margin-left: auto;
        margin-right: auto;
      }

      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 28px;
        background: #4ee1a0;
        border: 1px solid #4ee1a0;
        border-radius: 8px;
        color: #171717;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.22s, color 0.22s, transform 0.22s;
      }

      .home-btn:hover {
        background: transparent;
        color: #4ee1a0;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1 class="title">Page Not Found</h1>
      <p class="sub">Looks like this page doesn't exist or was moved.</p>
      <a href="./index.html" class="home-btn" id="home-btn">&#8592; Back to Home</a>
    </div>

    <script>
      document.getElementById('home-btn').addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.href;
        document.body.classList.add('leaving');
        setTimeout(function() { window.location.href = href; }, 350);
      });
    </script>
  </body>
</html>
